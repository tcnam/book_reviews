[tools]
node = "20"
yarn = "4.3"

[tasks.lib_install]
run = "yarn install"

[tasks.doc_build]
run = "yarn build"

[tasks.doc_local]
# This will run build first, then start
depends = ["doc_build"]
run = "yarn start"

[tasks.doc_remote_mac]
description = "Deploy from macOS"
run = [
  "yarn build",
  "git add .",
  "git commit -m 'update doc'",
  "git push origin source",
  "USE_SSH=true yarn deploy"
]

[tasks.doc_remote_win]
description = "Deploy from Windows"
# Using powershell as the shell for Windows consistency
shell = "powershell"
run = [
  "yarn build",
  "git add .",
  "git commit -m 'update doc'",
  "git push origin source",
  "$env:USE_SSH='true'; yarn deploy"
]
